# Fuzzing nocturne du cœur Rust (cargo-fuzz, libFuzzer, Rust nightly). 10 minutes par cible.
name: Fuzzing

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [secret_classify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust nightly et cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked --version 0.13.2
      - name: Fuzzing ${{ matrix.target }}
        working-directory: rust
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=600
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: plantages-${{ matrix.target }}
          path: rust/fuzz/artifacts/
