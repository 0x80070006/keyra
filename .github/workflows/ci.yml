# Intégration continue de Keyra. Toutes les actions sont épinglées par empreinte de commit (Scorecard) ;
# Dependabot les met à jour (.github/dependabot.yml). Le jeton n'a que les droits de lecture.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  rust:
    name: Rust (fmt, clippy, tests, cargo-deny)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: cargo-deny (licences, avis RustSec, sources)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --locked check

  android:
    name: Android (garde-fous, tests JVM, lint, release, manifeste, SBOM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: NDK épinglé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - name: Chaîne Rust épinglée
        working-directory: rust
        run: rustup toolchain install
      - name: Build et vérifications
        run: ./gradlew --stacktrace :app:logGuard :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:sbom :benchmark:assembleBenchmark
      - name: Manifeste de release (aucune permission, composants en liste blanche, ni debuggable ni profileable)
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          python3 tools/check_manifest.py "$AAPT2" app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Empreinte de l'APK
        run: sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee apk.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyra-release-unsigned
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            apk.sha256
            app/build/reports/keyra/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rapports
          path: |
            app/build/reports/
            app/build/test-results/

  instrumented:
    name: Tests instrumentés (émulateur API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: NDK épinglé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - name: Chaîne Rust épinglée
        working-directory: rust
        run: rustup toolchain install
      - name: Accès KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compiler les APK avant de démarrer l'émulateur
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tests-instrumentes
          path: app/build/outputs/androidTest-results/

  reproducible:
    name: Build reproductible (${{ matrix.dossier }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        dossier: [premier, "un/autre/chemin"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.dossier }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - name: NDK épinglé
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - name: Build release sans cache
        working-directory: ${{ matrix.dossier }}
        run: |
          (cd rust && rustup toolchain install)
          ./gradlew --no-build-cache :app:assembleRelease
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$GITHUB_WORKSPACE/keyra.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repro-${{ strategy.job-index }}
          path: keyra.apk

  reproducible-compare:
    name: Comparer les deux builds
    needs: reproducible
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: repro-*
      - name: Les deux APK doivent être identiques octet pour octet
        run: |
          sha256sum repro-0/keyra.apk repro-1/keyra.apk
          if ! cmp -s repro-0/keyra.apk repro-1/keyra.apk; then
            echo "::error::Build non reproductible. Entrées qui diffèrent :"
            for f in $(unzip -Z1 repro-0/keyra.apk); do
              a=$(unzip -p repro-0/keyra.apk "$f" | sha256sum); b=$(unzip -p repro-1/keyra.apk "$f" | sha256sum)
              [ "$a" = "$b" ] || echo "  $f"
            done
            exit 1
          fi
