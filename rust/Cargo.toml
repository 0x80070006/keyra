[workspace]
resolver = "3"
members = ["keyra-core", "keyra-jni"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Aucun texte tapé sur la sortie standard ou d'erreur (menace I-8).
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false

# Argon2id à 64 Mio : optimisé même en debug, sinon les tests prennent des dizaines de secondes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
