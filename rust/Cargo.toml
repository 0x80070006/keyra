[workspace]
resolver = "3"
members = ["keyra-core", "keyra-jni"]
exclude = ["fuzz"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
debug = false
