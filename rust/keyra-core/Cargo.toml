[package]
name = "keyra-core"
version = "0.1.0"
description = "Cœur de Keyra : fonctions pures et chiffrement, sans unsafe, sans entrée-sortie."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
# AEAD XChaCha20-Poly1305 (RustCrypto). Sans getrandom : les nonces viennent de SecureRandom côté Kotlin. ADR-0024.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
zeroize = "1.9"

[dev-dependencies]
proptest = "1.11"
